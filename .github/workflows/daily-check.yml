name: Daily Overdue Check

on:
  schedule:
    - cron: '0 13 * * *'  # 8AM CST daily
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — computes the overdue-invoice count and verifies Gmail auth, but never sends the reminder email. Only usable via manual dispatch; the scheduled trigger always runs for real.'
        required: false
        type: boolean
        default: false
      diagnostic:
        description: 'Diagnostic — exercises the full real send path (query, recipients, message build, Gmail auth) and stops before the actual send, reporting exactly which phase would fail. Takes priority over dryRun if both are set. Only usable via manual dispatch.'
        required: false
        type: boolean
        default: false

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger overdue check on the Worker
        run: |
          URL="${{ vars.WORKER_URL }}/api/cron/overdue-check"
          if [ "${{ inputs.diagnostic }}" = "true" ]; then
            URL="${URL}?diagnostic=true"
            echo "Diagnostic — no reminder email will be sent."
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            URL="${URL}?dryRun=true"
            echo "Dry run — no reminder email will be sent."
          fi
          for i in {1..3}; do
            echo "Attempt $i of 3..."
            if curl --fail-with-body -sS -X POST \
                -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
                "$URL"; then
              echo "✓ Overdue check triggered successfully"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "✗ Request failed, waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          echo "✗ Failed after 3 attempts"
          exit 1
