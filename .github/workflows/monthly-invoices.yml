name: Monthly Invoice Notice

on:
  schedule:
    - cron: '0 13 20 * *'  # 8AM CST on the 20th
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run — computes the next-month invoice count and verifies Gmail auth, but never sends the notice email. Only usable via manual dispatch; the scheduled trigger always runs for real.'
        required: false
        type: boolean
        default: false
      diagnostic:
        description: 'Diagnostic — exercises the full real send path (query, recipients, message build, Gmail auth) and stops before the actual send, reporting exactly which phase would fail. Takes priority over dryRun if both are set. Only usable via manual dispatch.'
        required: false
        type: boolean
        default: false

jobs:
  run-monthly-invoices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly invoice notice on the Worker
        run: |
          URL="${{ vars.WORKER_URL }}/api/cron/monthly-invoices"
          if [ "${{ inputs.diagnostic }}" = "true" ]; then
            URL="${URL}?diagnostic=true"
            echo "Diagnostic — no notice email will be sent."
          elif [ "${{ inputs.dryRun }}" = "true" ]; then
            URL="${URL}?dryRun=true"
            echo "Dry run — no notice email will be sent."
          fi
          curl --fail-with-body -sS -X POST \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            "$URL"
