<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Mi Casa Care Homes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5D440B">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="static-page-body">
  <div class="static-card">
    <img class="static-logo" src="/assets/brand/mi-casa-logo-full-black.png" alt="Mi Casa Care Homes">
    <h1>Change Your Password</h1>
    <p class="subtitle" id="subtitle">You must set a new password before continuing.</p>

    <div class="error-box" id="error-box" hidden></div>

    <form id="change-form">
      <div class="field">
        <label for="current-password">Current Password</label>
        <input type="password" id="current-password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="new-password">New Password (min 12 characters)</label>
        <input type="password" id="new-password" autocomplete="new-password" required minlength="12">
      </div>
      <div class="field">
        <label for="confirm-password">Confirm New Password</label>
        <input type="password" id="confirm-password" autocomplete="new-password" required minlength="12">
      </div>
      <button type="submit" class="primary-btn" id="submit-btn">Change Password</button>
    </form>

    <footer>&copy; <span id="year"></span> Mi Casa Care Homes LLC</footer>
  </div>

  <script src="/year.js"></script>
  <script src="/change-password.js"></script>
</body>
</html>
