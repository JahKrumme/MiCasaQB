<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Casa QuickBooks Assistant</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Casa QB">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="chat-body">

<div id="app">
  <div id="app-header-root"></div>

  <div id="banner" hidden role="status"></div>

  <main class="chat-shell app-shell">
    <div id="messages" role="log" aria-live="polite" aria-label="Conversation with the QuickBooks Assistant"></div>

    <div id="access-notice">
      <span>QuickBooks automation for Access Mental Health is coming soon. For now, ask me any QuickBooks how-to question.</span>
    </div>

    <div id="quick-actions">
      <button class="quick-btn" data-action="create invoices">Create Invoices</button>
      <button class="quick-btn" data-action="record a payment">Record Payment</button>
      <button class="quick-btn" data-action="add a new resident">Add Resident</button>
      <button class="quick-btn" data-action="show overdue invoices">Overdue Invoices</button>
    </div>

    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Ask about recording a transaction…" aria-label="Message to the QuickBooks Assistant"></textarea>
      <button id="send-btn" aria-label="Send message">Send</button>
    </div>
  </main>
</div>

<script src="/qbo-status.js"></script>
<script src="/header.js"></script>
<script src="/app.js"></script>
<script type="module" src="/update.js"></script>
</body>
</html>
