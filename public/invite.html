<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Invitation — Mi Casa Care Homes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#FAF8F3">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="static-page-body">
  <div class="static-card">
    <img class="logo-full" src="/assets/brand/mi-casa-logo-full-black.png" alt="Mi Casa Care Homes">
    <h1>You're Invited</h1>
    <p class="subtitle" id="invite-subtitle">Loading invitation&hellip;</p>

    <div class="error-box" id="error-box" hidden></div>

    <form id="accept-form" hidden>
      <div class="field">
        <label for="password">New Password (min 12 characters)</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="12">
      </div>
      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" autocomplete="new-password" required minlength="12">
      </div>
      <button type="submit" class="primary-btn" id="submit-btn">Create Account &amp; Sign In</button>
    </form>

    <footer>&copy; <span id="year"></span> Mi Casa Care Homes LLC</footer>
  </div>

  <script src="/year.js"></script>
  <script src="/invite.js"></script>
</body>
</html>
