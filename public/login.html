<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Mi Casa Care Homes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5D440B">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="static-page-body">
  <div class="static-card">
    <img class="static-logo" src="/assets/brand/mi-casa-logo-full-black.png" alt="Mi Casa Care Homes">
    <h1>Mi Casa QuickBooks Assistant</h1>
    <p class="subtitle">For authorized Mi Casa Care Homes staff only. Sign in with your staff account to continue.</p>

    <div class="error-box" id="error-box" hidden></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary-btn" id="submit-btn">Sign In</button>
    </form>

    <footer>
      &copy; <span id="year"></span> Mi Casa Care Homes LLC
      <div class="legal-links"><a href="/terms.html">Terms</a>&middot;<a href="/privacy.html">Privacy</a></div>
    </footer>
  </div>

  <script src="/login.js"></script>
</body>
</html>
